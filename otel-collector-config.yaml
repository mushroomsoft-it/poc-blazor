receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch:

exporters:
  otlphttp/tempo:
    endpoint: "http://tempo1:4318"

  prometheus:
    endpoint: "0.0.0.0:8889"
  
  debug:
    verbosity: detailed
  
  file:
    path: /var/log/otel/logs.json

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlphttp/tempo]

    logs:
      receivers: [otlp]
      processors: [batch]
      exporters: [file]

    metrics:
      receivers: [otlp]
      processors: [batch]
      exporters: [debug, prometheus]
