apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
      - name: frontend
        image: ghcr.io/USER/REPO-frontend:latest
        ports:
        - containerPort: 80
        env:
        - name: BaseUrl
          value: "http://api-service.default.svc.cluster.local"
        - name: Authority
          value: "${AUTHORITY}"

        - name: ClientId
          value: "${CLIENT_ID}"

        - name: RedirectUri
          value: "${REDIRECT_URI}"

        - name: PostLogoutRedirectUri
          value: "${POST_LOGOUT_REDIRECT_URI}"

        - name: MetadataUrl
          value: "${METADATA_URL}"
