apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: poc-blazor-ingress
  namespace: poc-blazor
  annotations:
    kubernetes.io/ingress.class: alb
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP":80}]'
    alb.ingress.kubernetes.io/healthcheck-path: /
    alb.ingress.kubernetes.io/actions.api-rewrite: >
      {"type":"forward","forwardConfig":{"targetGroups":[{"serviceName":"api-service","servicePort":"8080"}]}, "targetGroupStickinessConfig": {"enabled": false}, "rewriteConfig": {"pathPrefix": "/"}}
spec:
  ingressClassName: alb
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend-service
                port:
                  number: 80

          - path: /api
            pathType: Prefix
            backend:
              service:
                name: api-rewrite
                port:
                  name: use-annotation
