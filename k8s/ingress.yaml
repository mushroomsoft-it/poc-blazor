apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: poc-blazor-ingress
  namespace: poc-blazor
  annotations:
    kubernetes.io/ingress.class: alb
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP":80}]'
    alb.ingress.kubernetes.io/healthcheck-path: /weatherforecast
spec:
  rules:
    - http:
        paths:
          # Backend en /weatherforecast
          - path: /weatherforecast
            pathType: Prefix
            backend:
              service:
                name: api-service
                port:
                  number: 8080

          # Frontend en /
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend-service
                port:
                  number: 80