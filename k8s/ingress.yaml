apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: poc-blazor-ingress
  namespace: poc-blazor
  annotations:
    kubernetes.io/ingress.class: nginx # o alb si usas AWS ALB Controller
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  tls:
    - hosts:
        - dev.n8nmushroomsoft-it.com
      secretName: blazor-tls  # <--- aquí pones tu secreto de cert-manager
  rules:
    - host: dev.n8nmushroomsoft-it.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend-service
                port:
                  number: 80
