apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api-service
  template:
    metadata:
      labels:
        app: api-service
    spec:
      containers:
      - name: api-service
        image: ghcr.io/mushroomsoft-it/poc-blazor-api:latest
        ports:
        - containerPort: 80
        env:
          - name: CorsOrigins
            value: "${CORS_ORIGINS}"

          - name: ConnectionStrings__DefaultConnection
            value: "${CONNECTIONSTRINGS__DEFAULTCONNECTION}"
      
