worker_processes auto;

events { worker_connections 1024; }

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # =========================
    #  1. REDIRECCIÓN A HTTPS
    # =========================
    server {
        listen 80;
        server_name _;

        return 301 https://$host$request_uri;
    }

    # =========================
    #  2. SERVIDOR HTTPS
    # =========================
    server {
        listen 443 ssl;
        server_name _;

        # Certificados SSL
        ssl_certificate     /etc/nginx/certs/blazor.crt;
        ssl_certificate_key /etc/nginx/certs/blazor.key;

        root /usr/share/nginx/html;
        index index.html;

        # ===============================
        #  Brotli y Gzip para JS / WASM
        # ===============================

        # JS Brotli
        location ~* \.js\.br$ {
            add_header Content-Encoding br;
            types { application/javascript js; }
            try_files $uri =404;
        }

        # JS gzip
        location ~* \.js\.gz$ {
            add_header Content-Encoding gzip;
            types { application/javascript js; }
            try_files $uri =404;
        }

        # WASM brotli
        location ~* \.wasm\.br$ {
            add_header Content-Encoding br;
            types { application/wasm wasm; }
            try_files $uri =404;
        }

        # WASM gzip
        location ~* \.wasm\.gz$ {
            add_header Content-Encoding gzip;
            types { application/wasm wasm; }
            try_files $uri =404;
        }

        # ===============================
        #  Archivos del framework
        # ===============================
        location /_framework/ {
            try_files $uri =404;
            add_header Cache-Control "public, max-age=31536000, immutable";
        }

        location /_content/ {
            try_files $uri =404;
            add_header Cache-Control "public, max-age=31536000, immutable";
        }

        # ===============================
        #  Routing de Blazor
        # ===============================
        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
