name: Build Full Solution

on:
  pull_request:
    branches: ["main"]

permissions:
  contents: write
  pages: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore

      - name: Run Tests with Coverage
        run: |
          dotnet test \
            --no-build \
            --collect:"XPlat Code Coverage" \
            --results-directory ./coverage

      - name: Install ReportGenerator
        run: dotnet tool install -g dotnet-reportgenerator-globaltool

      - name: Add ReportGenerator tool to PATH
        run: echo "$HOME/.dotnet/tools" >> $GITHUB_PATH

      - name: Generate Coverage Report
        run: |
          reportgenerator \
            "-reports:coverage/**/coverage.cobertura.xml" \
            "-targetdir:coverage-report" \
            "-reporttypes:Html;JsonSummary"

      - name: Read Coverage Percentage
        id: coverage
        run: |
          pct=$(jq -r '.summary.linecoverage' coverage-report/Summary.json)
          echo "pct=$pct" >> $GITHUB_OUTPUT

      - name: Upload Coverage Report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage-report

      - name: Build Coverage Breakdown
        id: breakdown
        run: |
          if jq -e '.assemblies' coverage-report/Summary.json > /dev/null; then
            breakdown=$(jq -r '
              .assemblies[]
              | "- \(.name): \(.linecoverage)%"
            ' coverage-report/Summary.json)
          else
            breakdown="- Proyecto único: ${{ steps.coverage.outputs.pct }}%"
          fi

          echo "text<<EOF" >> $GITHUB_OUTPUT
          echo "$breakdown" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Comment Coverage on PR
        if: github.event_name == 'pull_request'
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          message: |
            ## 📊 Cobertura de Código

            **Total:** `${{ steps.coverage.outputs.pct }}%`

            **Por proyecto:**
            ${{ steps.breakdown.outputs.text }}

            ✔ El reporte HTML está disponible en artifacts.  
            _Informe generado automáticamente._
            ✔ Reporte público:
            https://github.io/${{ github.repository }}/coverage/

      - name: Enforce Coverage Threshold
        run: |
          MIN_COVERAGE=40
          ACTUAL_COVERAGE=${{ steps.coverage.outputs.pct }}

          echo "Coverage: $ACTUAL_COVERAGE%"
          echo "Minimum required: $MIN_COVERAGE%"

          awk "BEGIN {exit !($ACTUAL_COVERAGE < $MIN_COVERAGE)}" \
            && echo "❌ Coverage too low" \
            && exit 1 \
            || echo "✅ Coverage OK"

      - name: Deploy coverage report to GitHub Pages
        if: github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: coverage-report
          destination_dir: coverage
          keep_files: true
