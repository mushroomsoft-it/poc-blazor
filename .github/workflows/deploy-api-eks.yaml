name: Deploy API to EKS

on:
  workflow_call:
    secrets:
      AWS_ACCOUNT_ID:
        required: true
    inputs:
      image_api:
        required: true
        type: string

  workflow_dispatch:
    inputs:
      image_api:
        description: "API image tag for EKS"
        required: true
        default: "ghcr.io/sfalconi2001/poc-telemetry-managed-api:latest"

permissions:
  id-token: write
  contents: read
  packages: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/GitHub-Actions-Deploy-Role
          aws-region: us-east-1

      - name: Update kubeconfig
        run: aws eks update-kubeconfig --name poc-blazor-eks-cluster --region us-east-1

      - name: Apply API manifests
        run: |
          kubectl apply -n dotnet9-app -f k8s/backend-service.yaml
          kubectl apply -n dotnet9-app -f k8s/backend-deployment.yaml
      - name: Update API image (rolling update)
        run: |
          echo "Updating API image to: ${{ inputs.image_api }}"
          kubectl -n dotnet9-app set image deployment/backend-deployment \
            backend=${{ inputs.image_api }}
          kubectl -n dotnet9-app rollout status deployment/backend-deployment --timeout=120s