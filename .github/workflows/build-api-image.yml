name: Build API Docker Image and Push to GitHub Container Registry

on:
    push:
        branches: ["main"]
        paths:
            - "src/ApiService/**"

permissions:
    contents: read
    packages: write

env:
    REGISTRY: ghcr.io
    IMAGE_NAME: ${{ github.repository_owner }}/poc-blazor-api:build-${{ github.run_id }}

jobs:
    build_app_and_push_image:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - uses: actions/setup-dotnet@v4
              with:
                  dotnet-version: "9.0.x"

            - name: Publish API
              run: |
                  dotnet restore src/ApiService/ApiService.csproj
                  dotnet build src/ApiService/ApiService.csproj -c Release
                  dotnet publish src/ApiService/ApiService.csproj -c Release -o src/ApiService/publish

            - name: Log in to GitHub Container Registry
              uses: docker/login-action@v3
              with:
                  registry: ${{ env.REGISTRY }}
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Build & Push Docker image
              uses: docker/build-push-action@v4
              with:
                  context: src/ApiService
                  file: src/ApiService/Dockerfile
                  push: true
                  tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}

            - name: Verify API Docker image
              run: |
                  docker run -d --name test-api -p 8080:8080 ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
                  sleep 15
                  docker ps
                  docker logs test-api
                  curl -I http://localhost:8080/ || echo "API did not respond"
                  docker stop test-api
                  docker rm test-api

            - name: Log out from GitHub Container Registry
              run: docker logout ${{ env.REGISTRY }}
